name: Client checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "cryptography>=42,<47" "certifi>=2024.2.2" "sqlparse>=0.5,<1"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Validate release metadata
        run: python tools/release_builder.py --check-only
      - name: Run regression tests
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Verify full cumulative package and runtime manifest
        run: |
          python tools/release_builder.py
          python tools/verify_full_bundle.py dist/ORBITclip_CleanInstall_v7_8_7.zip
          python -m unittest -v test_v782_snapshot test_v783_extract test_v784_transfer test_v785_release_discovery test_v786_sql_semantics test_v787_sql_planner

  qt-drum:
    name: Real Qt offscreen drum render
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PySide6
        run: python -m pip install 'PySide6>=6.7,<7'
      - name: Verify transparent Qt canvas and animated wheel
        run: python -m unittest -v test_v741_qt test_v751_qt test_v760_qt test_v761_qt test_v762_qt test_v763_visual_qt test_v770_qt test_v780_qt test_v783_qt test_v786_sql_qt test_v787_sql_qt

  native-smoke:
    name: Native CI smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      ORBIT_CAPTURE_DIR: drum-audit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt smoke dependencies
        run: python -m pip install "PySide6>=6.7,<7" "sqlparse>=0.5,<1" "cryptography>=42,<47" "certifi>=2024.2.2"
      - name: Build and verify portable one-hop full package
        run: |
          python tools/release_builder.py
          python tools/verify_full_bundle.py dist/ORBITclip_CleanInstall_v7_8_7.zip
          python -m unittest -v test_v782_snapshot test_v784_transfer
      - name: Cross-platform visual QImage rendering (no native popup)
        run: python -m unittest -v test_v763_visual_qt test_v770_qt test_v780_qt test_v783_qt test_v786_sql_qt test_v787_sql_qt
      - name: Preserve drum screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drum-audit-${{ matrix.os }}
          path: drum-audit/
          if-no-files-found: ignore
