name: Client checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "cryptography>=42,<47" "Pillow>=10,<13" "certifi>=2024.2.2" "sqlparse>=0.5,<1" "pytesseract>=0.3.10,<1"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Validate release metadata
        run: python tools/release_builder.py --check-only
      - name: Run regression tests
        run: python -m unittest discover -p 'test_*.py' -q
