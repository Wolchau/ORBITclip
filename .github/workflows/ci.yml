name: Client checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "cryptography>=42,<47" "Pillow>=10,<13" "certifi>=2024.2.2" "sqlparse>=0.5,<1" "pytesseract>=0.3.10,<1"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Validate release metadata
        run: python tools/release_builder.py --check-only
      - name: Run regression tests
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Verify small patch artifact and base version
        run: |
          python tools/release_builder.py
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          path=Path('dist/ORBITclip_Patch_v7_5_1.zip')
          assert path.is_file(), 'Patch archive missing'
          assert path.stat().st_size < 400_000, 'Patch is unexpectedly large'
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              manifest=json.loads(z.read('ORBITclip_Patch_v7_5_1/manifest.json'))
              assert manifest['from_version']=='7.5.0'
              assert manifest['to_version']=='7.5.1'
              assert any(x['path']=='orbit_select.py' for x in manifest['changes'])
              assert all('.venv' not in x and '/test_' not in x for x in names)
          print(path.name, path.stat().st_size, 'bytes')
          PY

  qt-drum:
    name: Real Qt offscreen drum render
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PySide6
        run: python -m pip install 'PySide6>=6.7,<7'
      - name: Verify transparent Qt canvas and animated wheel
        run: python -m unittest -v test_v741_qt test_v751_qt test_v760_qt
