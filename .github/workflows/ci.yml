name: Client checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install "cryptography>=42,<47" "certifi>=2024.2.2" "sqlparse>=0.5,<1"
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Validate release metadata
        run: python tools/release_builder.py --check-only
      - name: Run regression tests
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Verify small patch artifact and base version
        run: |
          python tools/release_builder.py
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          path=Path('dist/ORBITclip_Patch_v7_8_0.zip')
          assert path.is_file(), 'Patch archive missing'
          assert path.stat().st_size < 400_000, 'Patch is unexpectedly large'
          with zipfile.ZipFile(path) as z:
              names=z.namelist()
              manifest=json.loads(z.read('ORBITclip_Patch_v7_8_0/manifest.json'))
              assert manifest['from_version']=='7.7.1'
              assert manifest['to_version']=='7.8.0'
              assert any(x['path']=='orbit_flow.py' for x in manifest['changes'])
              assert all('.venv' not in x and '/test_' not in x for x in names)
          assert all(x['path']!='README.md' for x in manifest['changes'])
          assert all(x['path']!='client_defaults.json' for x in manifest['changes'])
          print(path.name, path.stat().st_size, 'bytes')
          PY
      - name: Install real ZIP on previous version, reject tampering and exercise rollback
        run: python tools/verify_release_upgrade.py dist/ORBITclip_Patch_v7_8_0.zip

  qt-drum:
    name: Real Qt offscreen drum render
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PySide6
        run: python -m pip install 'PySide6>=6.7,<7'
      - name: Verify transparent Qt canvas and animated wheel
        run: python -m unittest -v test_v741_qt test_v751_qt test_v760_qt test_v761_qt test_v762_qt test_v763_visual_qt test_v770_qt

  native-smoke:
    name: Native CI smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      ORBIT_CAPTURE_DIR: drum-audit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt smoke dependencies
        run: python -m pip install "PySide6>=6.7,<7" "sqlparse>=0.5,<1"
      - name: Build and install true patch on previous version
        run: |
          python tools/release_builder.py
          python tools/verify_release_upgrade.py dist/ORBITclip_Patch_v7_8_0.zip
      - name: Cross-platform visual QImage rendering (no native popup)
        run: python -m unittest -v test_v763_visual_qt test_v770_qt
      - name: Preserve drum screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drum-audit-${{ matrix.os }}
          path: drum-audit/
          if-no-files-found: ignore
